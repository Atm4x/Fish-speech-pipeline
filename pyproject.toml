[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish_speech_lib"
version = "0.1.1.1"
description = "Python library interface for Fish Speech text-to-speech and voice-cloning inference."
authors = [
    {name = "Atm4x", email = "bloodyseiko@gmail.com"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["tts", "text-to-speech", "voice-cloning", "speech-synthesis", "fish-speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy<=1.26.4",
    "natsort>=8.4.0",
    "transformers>=4.45.2",
    "datasets==2.18.0",
    "lightning>=2.1.0",
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.2,<2.4",
    "tensorboard>=2.14.1",
    "einops>=0.7.0",
    "librosa>=0.9.1",
    "rich>=13.5.3",
    "wandb>=0.15.11",
    "grpcio>=1.58.0",
    "kui>=1.6.0",
    "uvicorn>=0.30.0",
    "loguru>=0.6.0",
    "resampy>=0.4.3",
    "zstandard>=0.22.0",
    "pydub",
    "pyaudio",
    "faster-whisper",
    "ormsgpack",
    "tiktoken>=0.8.0",
    "pydantic==2.9.2",
    "cachetools",
    "huggingface-hub",
    "loralib",
    "vector_quantize_pytorch==1.14.24",
]

[project.urls]
Homepage = "https://github.com/Atm4x/Fish-speech-pipeline"
Repository = "https://github.com/Atm4x/Fish-speech-pipeline"
"Bug Tracker" = "https://github.com/Atm4x/Fish-speech-pipeline/issues"
"Original Project" = "https://github.com/fishaudio/fish-speech"

[tool.setuptools.packages.find]
where = ["."]
include = ["fish_speech_lib*"]
